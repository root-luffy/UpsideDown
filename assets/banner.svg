<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="UpsideDown: one key flips one monitor between two computers">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1024"/>
      <stop offset="1" stop-color="#1c1240"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="380" rx="24" fill="url(#bg)"/>
  <g fill="#ffffff" opacity="0.05">
    <circle cx="1040" cy="60" r="140"/>
    <circle cx="140" cy="340" r="110"/>
  </g>

  <!-- Wordmark -->
  <text x="80" y="170" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="96" font-weight="800" fill="#22d3ee" letter-spacing="-2">Upside</text>
  <text x="528" y="170" text-anchor="middle" transform="rotate(180 528 136)" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="96" font-weight="800" fill="#f472b6" letter-spacing="-2">Down</text>
  <text x="84" y="222" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="28" fill="#c7c9e8">One key. Two computers. One monitor.</text>

  <!-- Keycap -->
  <g transform="translate(84 256)">
    <rect width="96" height="56" rx="10" fill="#2a2b4d" stroke="#4b4d7a" stroke-width="2"/>
    <rect x="4" y="4" width="88" height="42" rx="7" fill="#35376180"/>
    <text x="48" y="33" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#ffffff">Ctrl</text>
    <text x="118" y="36" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#8b8db8">+</text>
    <rect x="140" width="96" height="56" rx="10" fill="#2a2b4d" stroke="#4b4d7a" stroke-width="2"/>
    <rect x="144" y="4" width="88" height="42" rx="7" fill="#35376180"/>
    <text x="188" y="33" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#ffffff">F12</text>
  </g>

  <!-- Platforms -->
  <g transform="translate(356 270)" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600">
    <rect width="104" height="30" rx="15" fill="none" stroke="#22d3ee" stroke-width="2"/>
    <text x="52" y="21" text-anchor="middle" fill="#22d3ee">Windows</text>
    <rect x="116" width="84" height="30" rx="15" fill="none" stroke="#a78bfa" stroke-width="2"/>
    <text x="158" y="21" text-anchor="middle" fill="#a78bfa">Linux</text>
  </g>

  <!-- Monitor with split screen -->
  <g transform="translate(700 70)">
    <rect x="0" y="0" width="400" height="236" rx="16" fill="#0b0c1a" stroke="#4b4d7a" stroke-width="3"/>
    <clipPath id="screen"><rect x="14" y="14" width="372" height="208" rx="8"/></clipPath>
    <g clip-path="url(#screen)">
      <polygon points="14,14 230,14 170,222 14,222" fill="url(#left)"/>
      <polygon points="230,14 386,14 386,222 170,222" fill="url(#right)"/>
      <!-- Windows-ish logo -->
      <g transform="translate(62 84)" fill="#ffffff" opacity="0.92">
        <rect width="30" height="30" rx="3"/><rect x="34" width="30" height="30" rx="3"/>
        <rect y="34" width="30" height="30" rx="3"/><rect x="34" y="34" width="30" height="30" rx="3"/>
      </g>
      <!-- Laptop glyph -->
      <g transform="translate(262 88)" fill="none" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" opacity="0.92">
        <rect x="6" y="0" width="60" height="40" rx="5"/>
        <path d="M0 50 H72"/>
      </g>
    </g>
    <!-- Flip arrows -->
    <g fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M150 -18 C 180 -40, 230 -40, 256 -16"/>
      <path d="M244 -26 L 258 -14 L 242 -4"/>
    </g>
    <rect x="170" y="236" width="60" height="30" fill="#2a2b4d"/>
    <rect x="120" y="266" width="160" height="12" rx="6" fill="#2a2b4d"/>
  </g>
</svg>
